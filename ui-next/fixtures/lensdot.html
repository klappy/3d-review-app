<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Next fixture - Lens dot (provisional)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/lensdot.css">
<style>
  body { margin: 0; }
  .app { background: var(--ground); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; font-size: var(--t-16); line-height: 1.5; padding: 24px 16px; }
  .app h2 { font-size: var(--t-20); margin: 0 0 4px; }
  .app p { font-size: var(--t-14); color: var(--ink-2); margin: 0 0 16px; }
  .fx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 0 0 16px; }
  .fx-row h3 { flex: 0 0 100%; font-size: var(--t-13); color: var(--ink-3); margin: 0; font-weight: 600; }
  .fx-item { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-14); color: var(--ink); }
  /* Fixture-only box so the bare .pt colour binding is visible; real .pt geometry is the barbell's (not ported). */
  .fx-pt .pt { display: inline-block; width: 24px; height: 24px; border-radius: 50%; }
</style>
</head>
<body>
<!-- Contract: 3d-review-cookbook design/2026-10-15-glass-redesign/canvas/design-system.md section 2, Lens dot row.
     Every ported state, light and dark: the three data-lens values on .lensdot (named and beside text) and on .pt.
     Text stays --ink: perspective colour is graphic-only (V-33).
     Not shown: band and numeric barbells, data-lens on other components (V-39). -->
<main id="fixture"></main>
<script type="module">
  import { renderLensDot, renderLensPoint, LENSES } from "../components/lensdot.js";
  import { h } from "../components/h.js";

  const KEYS = Object.keys(LENSES);
  const row = (title, cls, ...items) => h("div", { class: cls ? `fx-row ${cls}` : "fx-row" }, h("h3", null, title), ...items);
  const sheet = (theme) => h("section", { class: "app", "data-theme": theme, "aria-label": `Lens dot, ${theme} theme` },
    h("h2", null, `Lens dot - ${theme}`),
    h("p", null, "Colour comes from data-lens only; text never takes a perspective colour."),
    row("Dot beside its name (dot is aria-hidden)", null, ...KEYS.map((lens) => h("span", { class: "fx-item" }, renderLensDot({ lens, decorative: true }), LENSES[lens]))),
    row("Dot alone (role=img, named)", null, ...KEYS.map((lens) => renderLensDot({ lens }))),
    row("Dot with a custom name", null, renderLensDot({ lens: "community", label: "Community, 12 responses" })),
    row(".pt colour binding (fixture box)", "fx-pt", ...KEYS.map((lens) => renderLensPoint({ lens }))),
  );
  document.getElementById("fixture").append(sheet("light"), sheet("dark"));
</script>
</body>
</html>
