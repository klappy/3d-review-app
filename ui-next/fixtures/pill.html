<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Next fixture - Stage pill (provisional)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/pill.css">
<style>
  body { margin: 0; }
  .app { background: var(--ground); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; font-size: var(--t-16); line-height: 1.5; padding: 24px 16px; }
  .app h2 { font-size: var(--t-20); margin: 0 0 4px; }
  .app p { font-size: var(--t-14); color: var(--ink-2); margin: 0 0 16px; }
  .fx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 16px; }
  .fx-row h3 { flex: 0 0 100%; font-size: var(--t-13); color: var(--ink-3); margin: 0; font-weight: 600; }
  .fx-title { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .fx-title strong { font-size: var(--t-24); }
</style>
</head>
<body>
<!-- Contract: 3d-review-cookbook design/2026-10-15-glass-redesign/canvas/design-system.md section 2, Stage pill row;
     section 1.2 Stage row. Every ported state, light and dark. Stages are neutral (ruling 2026-10-15).
     Not shown: closed (V-09). -->
<main id="fixture"></main>
<script type="module">
  import { renderPill, STAGES } from "../components/pill.js";
  import { h } from "../components/h.js";

  const sheet = (theme) => h("section", { class: "app", "data-theme": theme, "aria-label": `Stage pill, ${theme} theme` },
    h("h2", null, `Stage pill - ${theme}`),
    h("p", null, "The five ported stages; dot + label, all neutral."),
    h("div", { class: "fx-row" }, h("h3", null, "Stages"), ...STAGES.map((stage) => renderPill({ stage }))),
    h("div", { class: "fx-row" }, h("h3", null, "Beside a title"), h("div", { class: "fx-title" }, h("strong", null, "Example review"), renderPill({ stage: "collecting" }))),
  );
  document.getElementById("fixture").append(sheet("light"), sheet("dark"));
</script>
</body>
</html>
