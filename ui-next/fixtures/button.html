<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Next fixture - Button (provisional)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/button.css">
<style>
  body { margin: 0; }
  .app { background: var(--ground); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; font-size: var(--t-16); line-height: 1.5; padding: 24px 16px; }
  .app h2 { font-size: var(--t-20); margin: 0 0 4px; }
  .app p { font-size: var(--t-14); color: var(--ink-2); margin: 0 0 16px; }
  .fx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 16px; }
  .fx-row h3 { flex: 0 0 100%; font-size: var(--t-13); color: var(--ink-3); margin: 0; font-weight: 600; }
  .fx-block { max-width: 360px; }
</style>
</head>
<body>
<!-- Contract: 3d-review-cookbook design/2026-10-15-glass-redesign/canvas/design-system.md section 2, Button row.
     Every ported state, light and dark. Hover is live: point at a button (screenshots hover one per theme).
     Not shown: disabled (V-41). The page's one-primary rule (V-06, V-08) does not apply to a fixture sheet. -->
<main id="fixture"></main>
<script type="module">
  import { renderButton } from "../components/button.js";
  import { h } from "../components/h.js";

  const SVG = "http://www.w3.org/2000/svg";
  const icon = (d) => {
    const svg = document.createElementNS(SVG, "svg");
    for (const [k, v] of Object.entries({ width: "20", height: "20", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round" })) svg.setAttribute(k, v);
    const path = document.createElementNS(SVG, "path");
    path.setAttribute("d", d);
    svg.appendChild(path);
    return svg;
  };
  const PLUS = "M12 5v14M5 12h14", ARROW = "M5 12h14M13 6l6 6-6 6", DOTS = "M5 12h.01M12 12h.01M19 12h.01", HELP = "M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01";

  const row = (title, ...buttons) => h("div", { class: "fx-row" }, h("h3", null, title), ...buttons);
  const sheet = (theme) => h("section", { class: "app", "data-theme": theme, "aria-label": `Button, ${theme} theme` },
    h("h2", null, `Button - ${theme}`),
    h("p", null, "Default state; hover is live."),
    row("Variants", renderButton({ label: "Share the survey", variant: "primary" }), renderButton({ label: "Secondary" }), renderButton({ label: "Quiet", variant: "quiet" })),
    row("Leading / trailing icon", renderButton({ label: "Add a project", variant: "primary", lead: icon(PLUS) }), renderButton({ label: "Continue setup", trail: icon(ARROW) }), renderButton({ label: "Close", variant: "quiet", lead: icon(PLUS) })),
    row("Icon-only (aria-label required)", renderButton({ icon: icon(HELP), ariaLabel: "Help", variant: "quiet" }), renderButton({ icon: icon(DOTS), ariaLabel: "More actions" })),
    row("Large", renderButton({ label: "Read the results", variant: "primary", lg: true }), renderButton({ label: "Large secondary", lg: true })),
    row("Link", renderButton({ label: "Plan the next step", href: "#fixture" }), renderButton({ label: "Quiet link", variant: "quiet", href: "#fixture" })),
    h("div", { class: "fx-row fx-block" }, h("h3", null, "Block"), renderButton({ label: "Next", variant: "primary", block: true }), renderButton({ label: "Back", block: true })),
  );
  document.getElementById("fixture").append(sheet("light"), sheet("dark"));
</script>
</body>
</html>
