<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Review · Assessment</title>
<meta name="description" content="3D Review assessment workspace.">
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172e40;background:#edf3f8;font-synthesis:none;--ink:#172e40;--muted:#526779;--green:#14685f;--line:#c9d8e5;--glass:rgba(255,255,255,.7);--edge:rgba(255,255,255,.92)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 0% 8%,#c3e7e0,transparent 55%),radial-gradient(ellipse at 96% 28%,#d8d5f2,transparent 58%),radial-gradient(ellipse at 48% 95%,#d2e5f6,transparent 60%),#edf3f8;font-size:16px;line-height:1.55}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}a{color:var(--green);text-underline-offset:4px}button,.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 17px;border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.85);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 2px 6px #2543630d}button:hover,.button:hover{background:#fff;box-shadow:0 4px 12px #25436316}.primary{background:var(--green);color:#fff;border-color:transparent}.primary:hover{background:#10574f}.quiet{box-shadow:none;background:transparent;border-color:transparent;padding:8px 10px;color:var(--muted)}:focus-visible{outline:3px solid #287f97;outline-offset:3px}header{border-bottom:1px solid var(--edge);background:rgba(255,255,255,.52);backdrop-filter:blur(28px);padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:22px;font-weight:650;letter-spacing:-.7px;color:var(--ink);text-decoration:none}.brand span{color:var(--green)}.sample{font-size:13px;color:var(--muted);border:1px solid #ffffffd0;border-radius:20px;padding:4px 12px;background:#ffffff70;white-space:nowrap}main{max-width:1120px;margin:auto;padding:28px 24px 64px}.context{display:flex;gap:18px;align-items:end;margin-bottom:28px;flex-wrap:wrap}.context label{flex:1;min-width:210px;max-width:360px}.context .quiet{margin-left:auto}label{display:block;color:var(--muted);font-size:14px;font-weight:600}input:not([type=checkbox]):not([type=radio]),select,textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:11px 12px;background:#f8fbff;min-height:46px}textarea{min-height:105px;resize:vertical}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,38px);font-weight:600;line-height:1.2;letter-spacing:-1.2px;margin-bottom:10px}h2{font-size:23px;font-weight:600;line-height:1.3;letter-spacing:-.5px;margin-bottom:12px}h3{font-size:18px;font-weight:600;margin-bottom:8px}.eyebrow{text-transform:uppercase;font-size:12px;font-weight:650;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}.muted{color:var(--muted)}.small{font-size:14px}.title{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:25px}.badge{display:inline-block;border-radius:20px;padding:5px 12px;color:#31584e;background:#e3efeb;font-size:14px;white-space:nowrap}.tabs{display:flex;gap:5px;padding:5px;border:1px solid #ffffffaa;background:#ffffff40;border-radius:15px;margin-bottom:24px;max-width:660px}.tabs a{flex:1;text-align:center;padding:11px 12px;color:var(--muted);text-decoration:none;border-radius:11px;font-weight:600}.tabs a[aria-current=page]{color:var(--ink);background:#ffffffd0;box-shadow:0 4px 14px #2543630d}.panel{padding:28px;background:var(--glass);border:1px solid var(--edge);border-radius:20px;box-shadow:0 12px 35px #2543630d,inset 0 1px 0 var(--edge);backdrop-filter:blur(24px) saturate(115%)}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:22px}.stack{display:grid;gap:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}.field{margin-bottom:18px}.line{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.note{background:#e8f1f3;color:var(--ink);border-radius:12px;padding:15px 17px}.survey{display:flex;align-items:center;gap:16px;padding:19px 0;border-bottom:1px solid var(--line)}.survey:last-child{border-bottom:0;padding-bottom:0}.survey:first-of-type{padding-top:8px}.survey>div{flex:1}.survey p{margin:0}.dot{width:9px;height:35px;border-radius:4px;background:#49a076;flex:none}.dot.blue{background:#4885bb}.dot.gold{background:#d8ae3c}.project-card{display:block;color:var(--ink);text-decoration:none}.project-card:hover{border-color:#9dbeb7}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.check{display:flex;align-items:center;gap:10px;padding:11px 0;color:var(--ink);font-size:16px;font-weight:400}.check input{width:20px;height:20px;accent-color:var(--green)}.narrow{max-width:720px;margin:15px auto}.back{display:inline-block;margin-bottom:22px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.report-lens{padding:19px;border-radius:14px;background:#f8fbff;border-top:4px solid #49a076}.report-lens:nth-child(2){border-color:#4885bb}.report-lens:nth-child(3){border-color:#d8ae3c}.report-lens p{margin-bottom:0}.links{display:grid;gap:12px}.links a{overflow-wrap:anywhere}.status{min-height:24px;margin-top:16px;color:var(--green);font-size:14px}.choice{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:400;color:var(--ink);padding:14px;background:#f8fbff;border:1px solid var(--line);border-radius:12px;margin:10px 0}.choice input{width:18px;height:18px;accent-color:var(--green)}.storage-note{max-width:1120px;margin:0 auto;padding:0 24px 24px;font-size:13px;color:var(--muted)}.empty{padding:28px 0}.count{font-size:38px;font-weight:600;line-height:1.2;letter-spacing:-1px;margin:0 0 8px}.divider{height:1px;background:var(--line);margin:22px 0}dialog{border:1px solid var(--edge);border-radius:22px;max-width:600px;width:calc(100% - 32px);padding:28px;color:var(--ink);background:#f4f9fb;box-shadow:0 25px 100px #172e4030}dialog::backdrop{background:#172e4050;backdrop-filter:blur(5px)}.dialog-top{display:flex;align-items:start;justify-content:space-between;gap:10px}form p:last-child{margin-bottom:0}[hidden]{display:none!important}@media(max-width:720px){header{padding:18px 20px}main{padding:22px 16px 40px}.context{gap:12px;margin-bottom:22px}.context label{min-width:130px;max-width:none}.context .quiet{margin-left:0}.title{display:block}.title .badge{margin-top:4px}.grid,.project-grid,.report-grid{grid-template-columns:1fr}.panel{padding:22px}.tabs{gap:1px}.tabs a{padding:11px 5px;font-size:14px}.row{flex-wrap:wrap}.survey{gap:10px}.survey .button{padding:9px 11px;font-size:14px}.sample{font-size:12px}.storage-note{padding:0 16px 20px}}@media(prefers-reduced-transparency:reduce){.panel,header,dialog{background:#f8fbff;backdrop-filter:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.workspace-layout{max-width:1280px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}.context-panel{border-right:1px solid #ffffffc0;padding:8px 22px 20px 0}.context-project{margin-bottom:20px}.project-name{display:block;color:var(--ink);font-weight:650;text-decoration:none;padding:8px 10px}.assessment-link{display:block;padding:12px;margin:3px 0 3px 8px;color:var(--muted);text-decoration:none;border:1px solid transparent;border-radius:12px;font-size:14px}.assessment-link small{display:block;margin-top:4px;font-size:12px}.assessment-link[aria-current=page]{background:#ffffffb5;border-color:var(--edge);color:var(--ink);box-shadow:0 4px 14px #2543630d}.assessment-body{min-width:0}.context-panel .links a{font-size:14px}@media(max-width:900px){.workspace-layout{grid-template-columns:190px minmax(0,1fr);gap:20px}.workspace-layout .grid{grid-template-columns:1fr}.context-panel{padding-right:12px}}@media(max-width:650px){.workspace-layout{display:block}.context-panel{border-right:0;border-bottom:1px solid #ffffffc0;padding:0 0 18px;margin-bottom:22px}.context-panel nav{display:flex;gap:18px;flex-wrap:wrap}.context-project{flex:1;min-width:150px;margin-bottom:0}.context-panel .line{margin-top:12px;padding-top:12px;display:flex;flex-wrap:wrap;gap:16px}.assessment-link{margin-left:0}}
/* stage indicator (AMEND 2): same look as the showcase tabs, but spans — not controls */
.tabs span{flex:1;text-align:center;padding:11px 12px;color:var(--muted);border-radius:11px;font-weight:600}.tabs span[aria-current=step]{color:var(--ink);background:#ffffffd0;box-shadow:0 4px 14px #2543630d}
</style>
</head>
<body>
<header><a class="brand" href="#assessment">3D <span>Review</span></a><span class="sample" id="who">Checking session…</span></header>
<main id="app"><p class="muted" style="padding:24px">Loading…</p></main>

</html>
