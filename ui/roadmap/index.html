<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roadmap · 3D Review</title>
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
  <link rel="stylesheet" href="/roadmap/page.css">
</head>
<body class="rv">
  <header class="top"><a class="brand" href="/">3D <span>Review</span></a><nav aria-label="Main"><a href="/">Open app</a><a href="/roadmap/" aria-current="page">Roadmap</a><button id="version" class="quiet" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="changelog">Version…</button></nav></header>
  <main>
    <section id="roadmap-work" aria-labelledby="roadmap-title">
      <div class="headrow"><div><h1 id="roadmap-title">Roadmap</h1><p class="muted">Published plans, active work and completed work.</p></div><button id="refresh" type="button">Refresh roadmap</button></div>
      <p><a href="#versions">View version history and changelog</a></p>
      <p class="legend">✅ Done · 🟡 Pending · 🔴 Blocked · Not reported</p>
      <p class="small muted">Delivery reports and independent verification are shown separately.</p>
      <label class="history-choice"><input id="show-all" type="checkbox"> Show all published work</label>
      <p id="roadmap-status" role="status" aria-live="polite">Loading roadmap…</p>
      <div id="roadmap"></div>
      <noscript><p>JavaScript is needed for live updates. <a href="/v2/roadmap">Read the public roadmap data</a>.</p></noscript>
    </section>
    <section id="versions" class="versions" aria-label="Version history"></section>
  </main>
  <dialog class="panel" id="changelog" aria-labelledby="changelog-title"><h2 id="changelog-title">What changed</h2><p id="changelog-build" class="small muted"></p><div id="changelog-body"></div><button id="changelog-close" type="button">Close</button></dialog>
  <script type="module" src="/changelog.js"></script>
  <script type="module" src="/roadmap/page.js"></script>
  <script type="module" src="/roadmap/versions.js"></script>
</body>
</html>
