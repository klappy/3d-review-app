l{flex:1;min-width:210px;max-width:360px}.context .quiet{margin-left:auto}label{display:block;color:var(--muted);font-size:14px;font-weight:600}input:not([type=checkbox]):not([type=radio]),select,textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:11px 12px;background:#f8fbff;min-height:46px}textarea{min-height:105px;resize:vertical}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,38px);font-weight:600;line-height:1.2;letter-spacing:-1.2px;margin-bottom:10px}h2{font-size:23px;font-weight:600;line-height:1.3;letter-spacing:-.5px;margin-bottom:12px}h3{font-size:18px;font-weight:600;margin-bottom:8px}.eyebrow{text-transform:uppercase;font-size:12px;font-weight:650;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}.muted{color:var(--muted)}.small{font-size:14px}.title{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:25px}.badge{display:inline-block;border-radius:20px;padding:5px 12px;color:#31584e;background:#e3efeb;font-size:14px;white-space:nowrap}.tabs{display:flex;gap:5px;padding:5px;border:1px solid #ffffffaa;background:#ffffff40;border-radius:15px;margin-bottom:24px;max-width:660px}.tabs a{flex:1;text-align:center;padding:11px 12px;color:var(--muted);text-decoration:none;border-radius:11px;font-weight:600}.tabs a[aria-current=page]{color:var(--ink);background:#ffffffd0;box-shadow:0 4px 14px #2543630d}.panel{padding:28px;background:var(--glass);border:1px solid var(--edge);border-radius:20px;box-shadow:0 12px 35px #2543630d,inset 0 1px 0 var(--edge);backdrop-filter:blur(24px) saturate(115%)}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:22px}.stack{display:grid;gap:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}.field{margin-bottom:18px}.line{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}.note{background:#e8f1f3;color:var(--ink);border-radius:12px;padding:15px 17px}.survey{display:flex;align-items:center;gap:16px;padding:19px 0;border-bottom:1px solid var(--line)}.survey:last-child{border-bottom:0;padding-bottom:0}.survey:first-of-type{padding-top:8px}.survey>div{flex:1}.survey p{margin:0}.dot{width:9px;height:35px;border-radius:4px;background:#49a076;flex:none}.dot.blue{background:#4885bb}.dot.gold{background:#d8ae3c}.project-card{display:block;color:var(--ink);text-decoration:none}.project-card:hover{border-color:#9dbeb7}.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.check{display:flex;align-items:center;gap:10px;padding:11px 0;color:var(--ink);font-size:16px;font-weight:400}.check input{width:20px;height:20px;accent-color:var(--green)}.narrow{max-width:720px;margin:15px auto}.back{display:inline-block;margin-bottom:22px}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:22px}.report-lens{padding:19px;border-radius:14px;background:#f8fbff;border-top:4px solid #49a076}.report-lens:nth-child(2){border-color:#4885bb}.report-lens:nth-child(3){border-color:#d8ae3c}.report-lens p{margin-bottom:0}.links{display:grid;gap:12px}.links a{overflow-wrap:anywhere}.status{min-height:24px;margin-top:16px;color:var(--green);font-size:14px}.choice{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:400;color:var(--ink);padding:14px;background:#f8fbff;border:1px solid var(--line);border-radius:12px;margin:10px 0}.choice input{width:18px;height:18px;accent-color:var(--green)}.storage-note{max-width:1120px;margin:0 auto;padding:0 24px 24px;font-size:13px;color:var(--muted)}.empty{padding:28px 0}.count{font-size:38px;font-weight:600;line-height:1.2;letter-spacing:-1px;margin:0 0 8px}.divider{height:1px;background:var(--line);margin:22px 0}dialog{border:1px solid var(--edge);border-radius:22px;max-width:600px;width:calc(100% - 32px);padding:28px;color:var(--ink);background:#f4f9fb;box-s .workspace-layout{max-width:1280px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}.context-panel{border-right:1px solid #ffffffc0;padding:8px 22px 20px 0}.context-project{margin-bottom:20px}.project-name{display:block;color:var(--ink);font-weight:650;text-decoration:none;padding:8px 10px}.assessment-link{display:block;padding:12px;margin:3px 0 3px 8px;color:var(--muted);text-decoration:none;border:1px solid transparent;border-radius:12px;font-size:14px}.assessment-link small{display:block;margin-top:4px;font-size:12px}.assessment-link[aria-current=page]{background:#ffffffb5;border-color:var(--edge);color:var(--ink);box-shadow:0 4px 14px #2543630d}.assessment-body{min-width:0}.context-panel .links a{font-size:14px}@media(max-width:900px){.workspace-layout{grid-template-columns:190px minmax(0,1fr);gap:20px}.workspace-layout .grid{grid-template-columns:1fr}.context-panel{padding-right:12px}}@media(max-width:650px){.workspace-layout{display:block}.context-panel{border-right:0;border-bottom:1px solid #ffffffc0;padding:0 0 18px;margin-bottom:22px}.context-panel nav{display:flex;gap:18px;flex-wrap:wrap}.context-project{flex:1;min-width:150px;margin-bottom:0}.context-panel .line{margin-top:12px;padding-top:12px;display:flex;flex-wrap:wrap;gap:16px}.assessment-link{margin-left:0}}
/* stage indicator (AMEND 2): same look as the showcase tabs, but spans — not controls */
.tabs span{flex:1;text-align:center;padding:11px 12px;color:var(--muted);border-radius:11px;font-weight:600}.tabs span[aria-current=step]{color:var(--ink);background:#ffffffd0;box-shadow:0 4px 14px #2543630d}
.shell-nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}@media (max-width:650px){.shell-nav{gap:10px;font-size:14px}}.shell-nav a{font-weight:600}#whats-here{margin:6px auto 0}
.account{display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:100%;min-width:0}.account #who{overflow-wrap:anywhere;white-space:normal;max-width:100%}.account [hidden]{display:none}#account-status{flex-basis:100%;font-size:13px}#account-switch-dialog{max-width:min(520px,calc(100vw - 32px))}

<style>/* K3a compact chrome: one utility bar; account menu holds secondary controls; phone context collapsed. */
main#rv{max-width:none;margin:0;padding:0}
/* Stacking: the header (with its account menu popover) paints above the context aside and content, whose backdrop filters create their own stacking contexts. */
.rv header.top{position:relative;z-index:40}.rv .shell{position:relative;z-index:1}
.rv .top{padding:6px 16px;min-height:56px;gap:10px;row-gap:4px}.rv .brand{font-size:19px}.rv .brand span{padding:1px 7px}.rv .crumbs{padding:0 4px}.rv .top .right{margin-left:auto;min-width:0}.rv .header-host{display:flex;align-items:center;min-width:0}
.rv .account{position:relative;display:block;min-width:0}.rv #account-menu-toggle{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 10px;max-width:min(52vw,360px);text-align:left}.rv #who{font-size:13px;line-height:1.25;overflow-wrap:anywhere;white-space:normal;color:var(--ink)}.rv #account-menu-toggle .caret{flex:none}
.rv .account-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:flex;flex-direction:column;gap:2px;min-width:min(240px,calc(100vw - 16px));max-width:calc(100vw - 16px);inline-size:max-content;padding:8px;border-radius:var(--r-button);box-shadow:var(--shadow-button);overflow-wrap:anywhere}.rv .account-menu button,.rv .account-menu a{white-space:normal;text-align:left}.rv .account-menu[hidden]{display:none}.rv .account-menu button,.rv .account-menu a{display:flex;width:100%;min-height:44px;align-items:center;justify-content:flex-start;padding:8px 12px;text-decoration:none;color:var(--ink);border-radius:8px}.rv .account-menu a:hover,.rv .account-menu button:hover{background:var(--chip-fill)}.rv .account-menu .shell-nav{display:contents}.rv .account-menu #account-actions{display:contents}.rv .account-menu #account-actions[hidden]{display:none}.rv .account #account-status{display:block;font-size:12px;color:var(--secondary);padding:0 10px}.rv .account #account-status:empty{display:none}
.rv .tree-toggle{display:none}
@media (max-width:420px){.rv .account{position:static}.rv .account-menu{left:8px;right:8px;min-width:0;inline-size:auto;top:auto}}
@media (max-width:760px){.rv .top{min-height:48px;padding:2px 12px;gap:8px;row-gap:0}.rv .brand{font-size:17px}.rv .crumbs{display:flex;order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:0;margin:0;min-height:26px;font-size:12px}.rv .crumbs a{padding:3px 5px}.rv .crumbs::-webkit-scrollbar{display:none}.rv .crumbs a{flex:none;max-width:44vw}.rv .crumbs a[aria-current]{max-width:60vw}.rv .crumbs .tree-role{flex:none}.rv #account-menu-toggle{max-width:60vw;padding:0 8px;min-height:44px;line-height:1.2}.rv #who{font-size:12px;line-height:1.2}
 .rv aside.tree.collapsible{display:block;padding:8px 12px}.rv .tree-toggle{display:flex;width:100%;align-items:center;gap:10px;min-height:44px;padding:6px 10px;text-align:left}.rv .tree-toggle .eyebrow{margin:0;font-size:11px}.rv .tree-toggle-current{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}.rv .tree-panel{padding-top:8px}.rv .tree-panel[hidden]{display:none}}
/* K3a normal root: the kit shell owns header/tree/content; retained legacy regions are marked. */.rv .content{padding:var(--main-pad);min-width:0;max-width:1180px}@media (max-width:760px){.rv .content{padding:20px 14px}}.rv .header-host{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}.rv .header-host .shell-nav{gap:10px}.rv .account{font-size:13px}.legacy-actions{margin-top:28px;padding-top:18px;border-top:1px dashed var(--line)}.kit-read .grid{margin:12px 0}.manage-rows{list-style:none;padding:0;margin:0}.manage-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}.manage-row:last-child{border-bottom:0}.assessment-head{align-items:center;margin-bottom:14px}#shell-controls[hidden]{display:none}@media (max-width:760px){.rv .header-host{gap:6px 10px}.rv .header-host .shell-nav,.rv .account,.rv .header-host button{font-size:13px}.rv .header-host button,.rv .account button{min-height:34px;padding:4px 10px}}</style>

<!-- K3a: single kit header. The real controls below are MOVED (not cloned) into the shell's header host by assess.js; this wrapper is removed after adoption. -->
<div id="shell-controls" hidden><span id="account" class="account"><button id="account-menu-toggle" class="quiet" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-label="Account menu"><span class="sample" id="who" aria-live="polite">Checking session…</span><span class="caret" aria-hidden="true">▾</span></button><div id="account-menu" class="account-menu glass" hidden><span id="account-actions" hidden><button class="quiet" type="button" id="account-signout">Sign out</button><button class="quiet" type="button" id="account-switch">Use another account</button></span><button id="version" class="quiet" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="changelog">Version…</button><nav id="shell-links" class="shell-nav" aria-label="Workspace navigation"><a href="#feedback">App feedback</a><a href="/roadmap/">Roadmap</a></nav></div><span id="account-status" role="status"></span></span></div>
<main id="rv" class="rv"><p class="muted" style="padding:24px">Loading…</p></main>
<details class="storage-note" id="whats-here-wrap" hidden><summary>What is on this page</summary><p class="storage-note" id="whats-here"></p></details>
<p class="storage-note" id="note" role="status" aria-live="polite"></p>
<script type="module">import { css as a } from "/assess/scope.js"; import { css as b } from "/assess/views.js"; import { css as c } from "/assess/share.js"; const s = document.createElement("style"); s.textContent = a + b + c + `.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;margin-bottom:14px}.crumbs span{color:var(--muted)}.view-tabs a{flex:1;text-align:center;padding:11px 12px;color:var(--muted);border-radius:11px;font-weight:600;text-decoration:none}.view-tabs a[aria-current=page]{color:var(--ink);background:#ffffffd0;box-shadow:0 4px 14px #2543630d}#note.alert{color:#8a2a1c}.grid.start{align-items:start}.context-project summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.context-project summary::-webkit-details-marker{display:none}.context-project summary small{color:var(--muted);font-weight:500}.context-project[open]>summary{color:var(--green)}.report-full{margin-top:22px;max-width:100%}.report-full .report-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.entity-card-wrap{display:flex;flex-direction:column;gap:6px}.entity-card-wrap .card-actions{display:flex;justify-content:flex-end}.report-full [data-report-view]>ul,.report-full [data-report-view]>ul>li>ul{list-style:none;padding-left:0}.report-full [data-report-view] li{margin:6px 0}.context-disclosure>summary{display:none}@media (max-width:650px){.context-disclosure>summary{display:flex;flex-direction:column;gap:2px;list-style:none;cursor:pointer;padding:10px 12px;border:1px solid var(--edge);border-radius:12px;background:#ffffff85}.context-disclosure>summary::-webkit-details-marker{display:none}.context-disclosure[open]>summary{margin-bottom:12px}}.view-tabs{flex-wrap:wrap}@media (max-width:650px){.view-tabs a{flex:1 1 30%;padding:9px 6px;font-size:14px;min-width:0}}.report-exact{border-bottom:1px dotted var(--muted);cursor:help}.report-ids{margin-top:6px}`; document.head.append(s);</script>
<dialog class="panel" id="account-switch-dialog" aria-labelledby="account-switch-title"><h2 id="account-switch-title">Use another account</h2><p>You will be signed out here (and from this browser's Cloudflare sign-in, where this site uses it), then asked to sign in with the other account's email.</p><div class="actions"><button class="primary" type="button" id="account-switch-confirm">Sign out and use another account</button><button type="button" id="account-switch-cancel">Cancel</button></div></dialog>
<dialog class="panel" id="changelog" aria-labelledby="changelog-title"><h2 id="changelog-title">What changed</h2><p id="changelog-build" class="small muted"></p><div id="changelog-body"></div><button id="changelog-close" type="button">Close</button></dialog>
