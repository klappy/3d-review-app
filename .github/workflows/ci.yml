name: ci
on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]
env:
  # scripts/stamp-version.mjs requires the real 40-hex commit in CI (Workers Builds injects it; Actions must too)
  WORKERS_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  ci:
    # REQUIRED check (ruleset 23571595). typecheck only until the test suite is green on main —
    # 2026-09-28: version-stamp fixtures pin 0.16.0 and ~10 fake-DOM shared-submit tests fail on main itself.
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
  test:
    # Visible, not yet required. Becomes part of the gate once green on main (3D runner unit: fix the suite).
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
