openapi: 3.1.0
info:
  title: 3D Review API — contract-v0.1 (DRAFT)
  version: 0.1.0-draft
  description: Projected from cookbook 04 @ 0f4413768c4365054372d917619311d7c2a00e96 by Fable. 90 capabilities; every capability
    is also reachable via MCP docs/read/write/danger over the same handlers (prd/18-D). Paths marked x-path-inferred were
    elided in 04 and need Lane A confirmation. SUPPRESSED is ok:true. Danger twins are never GET.
servers:
- url: https://{host}/
  variables:
    host:
      default: TBD-OF-2
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Cloudflare email-code login → HttpOnly cookie (18-C)
    bearer:
      type: http
      scheme: bearer
      description: delegated agent bearer — acts as a user, never as a role (18-C / MCP-REQ-007)
    participant:
      type: http
      scheme: bearer
      description: participant token from redeem_code / open_link, bound to one assessment survey
  schemas:
    SyntheticReportPayload:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schema_version",
          "synthetic",
          "source_commit",
          "versions",
          "assessment_id",
          "lenses",
          "cross_lens_multi",
          "cross_lens_single",
          "standalone_indicators",
          "translation_type_agreement",
          "evidence",
          "narrative"
        ],
        "properties": {
          "schema_version": {
            "const": "3d-synthetic-assessment-report-v1"
          },
          "synthetic": {
            "const": true
          },
          "source_commit": {
            "const": "f042cde553761a6a7f24132cef7802f956378ee0"
          },
          "versions": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "scorer",
              "narrative",
              "policy"
            ],
            "properties": {
              "scorer": {
                "const": "steve-f042cde-single-assessment-v1"
              },
              "narrative": {
                "const": "steve-f042cde-rule-narrative-v1"
              },
              "policy": {
                "const": "synthetic-current-assessment-asof-query-v1"
              }
            }
          },
          "assessment_id": {
            "type": "string",
            "maxLength": 256,
            "minLength": 1,
            "description": "At most256 UTF-8 bytes."
          },
          "lenses": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "lens",
                "score",
                "n_subdims_included",
                "sub_dimensions"
              ],
              "properties": {
                "lens": {
                  "type": "string",
                  "maxLength": 256
                },
                "score": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 100
                },
                "n_subdims_included": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 5743
                },
                "sub_dimensions": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "sub_dimension",
                      "score",
                      "n_items_included"
                    ],
                    "properties": {
                      "sub_dimension": {
                        "type": "string",
                        "maxLength": 256
                      },
                      "score": {
                        "type": "number",
                        "minimum": 0,
                        "maximum": 100
                      },
                      "n_items_included": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 5743
                      }
                    }
                  },
                  "maxItems": 17
                }
              }
            },
            "maxItems": 3
          },
          "cross_lens_multi": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "construct_code",
                "construct_name",
                "triangulated_mean",
                "agreement_range",
                "n_lenses_included",
                "lens_scores"
              ],
              "properties": {
                "construct_code": {
                  "type": "string",
                  "maxLength": 256
                },
                "construct_name": {
                  "type": "string",
                  "maxLength": 256
                },
                "triangulated_mean": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 100
                },
                "agreement_range": {
                  "type": [
                    "number",
                    "null"
                  ],
                  "minimum": 0,
                  "maximum": 100
                },
                "n_lenses_included": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 5743
                },
                "lens_scores": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "lens",
                      "score"
                    ],
                    "properties": {
                      "lens": {
                        "type": "string",
                        "maxLength": 256
                      },
                      "score": {
                        "type": "number",
                        "minimum": 0,
                        "maximum": 100
                      }
                    }
                  },
                  "maxItems": 3
                }
              }
            },
            "maxItems": 8
          },
          "cross_lens_single": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "construct_code",
                "construct_name",
                "triangulated_mean",
                "agreement_range",
                "n_lenses_included",
                "lens_scores"
              ],
              "properties": {
                "construct_code": {
                  "type": "string",
                  "maxLength": 256
                },
                "construct_name": {
                  "type": "string",
                  "maxLength": 256
                },
                "triangulated_mean": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 100
                },
                "agreement_range": {
                  "type": [
                    "number",
                    "null"
                  ],
                  "minimum": 0,
                  "maximum": 100
                },
                "n_lenses_included": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 5743
                },
                "lens_scores": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "lens",
                      "score"
                    ],
                    "properties": {
                      "lens": {
                        "type": "string",
                        "maxLength": 256
                      },
                      "score": {
                        "type": "number",
                        "minimum": 0,
                        "maximum": 100
                      }
                    }
                  },
                  "maxItems": 3
                }
              }
            },
            "maxItems": 8
          },
          "standalone_indicators": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "item_id",
                "lens",
                "sub_dimension",
                "question_text",
                "score",
                "n_responses"
              ],
              "properties": {
                "item_id": {
                  "type": "string",
                  "maxLength": 256
                },
                "lens": {
                  "type": "string",
                  "maxLength": 256
                },
                "sub_dimension": {
                  "type": "string",
                  "maxLength": 256
                },
                "question_text": {
                  "type": "string",
                  "maxLength": 4096
                },
                "score": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 100
                },
                "n_responses": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 5743
                }
              }
            },
            "maxItems": 111
          },
          "translation_type_agreement": {
            "anyOf": [
              {
                "type": "null"
              },
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "construct_name",
                  "team_values",
                  "church_values",
                  "agree"
                ],
                "properties": {
                  "construct_name": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "team_values": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "maxLength": 256
                    },
                    "maxItems": 9
                  },
                  "church_values": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "maxLength": 256
                    },
                    "maxItems": 9
                  },
                  "agree": {
                    "type": [
                      "boolean",
                      "null"
                    ]
                  }
                }
              }
            ]
          },
          "evidence": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "form_type",
                "label",
                "n"
              ],
              "properties": {
                "form_type": {
                  "type": "string",
                  "maxLength": 256
                },
                "label": {
                  "type": "string",
                  "maxLength": 256
                },
                "n": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 5743
                }
              }
            },
            "maxItems": 9
          },
          "narrative": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 4096
            },
            "maxItems": 32
          }
        },
        "description": "Exact source-backed synthetic schema; canonical payload limit524288 UTF-8 bytes. Runtime also verifies exact canonical output from its original attested capture."
      }
    Receipt:
      type: object
      required:
      - id
      - actor
      - scope
      - class
      - trace_id
      - at
      properties:
        id:
          type: string
        actor:
          type: string
        scope:
          type: object
          properties:
            type:
              type: string
              enum:
              - workspace
              - project
              - assessment
              - survey
              - platform
            id:
              type: string
        class:
          type: string
          enum:
          - read
          - write.reversible
          - write.effect
          - write.dangerous
        undo_token:
          type: string
          description: present only when the row declares a true inverse
        inverse:
          type: string
          description: capability id or 'none'
        compensating_control:
          type: string
        trace_id:
          type: string
        at:
          type: string
          format: date-time
    Envelope:
      type: object
      required:
      - ok
      - capability
      - result
      properties:
        ok:
          const: true
        capability:
          type: string
        result:
          type: object
          additionalProperties: true
          properties:
            suppressed:
              type: boolean
              description: small-cell suppression applied; this is a success state
        receipt:
          $ref: '#/components/schemas/Receipt'
    ErrorEnvelope:
      type: object
      required:
      - ok
      - error
      properties:
        ok:
          const: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - NOT_AUTHENTICATED
              - NOT_AUTHORIZED_AT_SCOPE
              - WRONG_TOOL_FOR_CLASS
              - CONFIRM_REQUIRED
              - CONFIRM_EXPIRED
              - INVALID_PARAMS
              - NOT_FOUND_OR_NOT_VISIBLE
              - STAGE_CONFLICT
              - RESERVED_NOT_BUILT
              - NO_INVERSE
              - RATE_LIMITED
            message:
              type: string
            hint:
              type: string
            docs:
              type: string
              description: capability id or topic
    Impact:
      type: object
      required:
      - affected
      - irreversible
      - effect
      properties:
        affected:
          type: array
          items:
            type: object
        irreversible:
          type: boolean
        effect:
          type: string
          enum:
          - external
          - disclosure
          - destructive
        retention:
          type: string
        compensating_control:
          type: string
    DangerBody:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - dry_run
          - execute
        confirm_token:
          type: string
          description: required for execute; bound to intent; TTL per 18-C
        params:
          type: object
          additionalProperties: true
    DryRunResult:
      type: object
      properties:
        impact:
          $ref: '#/components/schemas/Impact'
        confirm_token:
          type: string
        expires_in:
          type: integer
    FeedbackExperience: {"type": "object", "minProperties": 1, "additionalProperties": false, "description": "Optional client-reported evidence, at most1536 UTF-8 JSON bytes; not trusted submission identity. No automatic capture implied.", "x-cookbook-source": "https://github.com/klappy/3d-review-cookbook/blob/f5d925f9f9d448828f7b7bb7afabc08ba6db933f/planning/2026-09-16-parity-build/AMEND-2026-09-18-feedback-provenance.md", "properties": {"occurred_at": {"type": "string", "format": "date-time", "pattern": "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{3}Z$"}, "surface": {"type": "string", "enum": ["web", "mcp_panel", "mcp_tool", "http", "unknown"]}, "host": {"type": "string", "enum": ["browser", "chatgpt", "claude", "reference_host", "other", "unknown"]}, "client_release": {"type": "object", "minProperties": 1, "additionalProperties": false, "properties": {"version": {"type": "string", "maxLength": 64, "pattern": "^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$"}, "commit": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "release_source": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "build_uuid": {"type": ["string", "null"], "format": "uuid"}, "environment": {"type": "string", "enum": ["dev", "production", "unknown"]}}}, "api_release": {"type": "object", "minProperties": 1, "additionalProperties": false, "properties": {"version": {"type": "string", "maxLength": 64, "pattern": "^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$"}, "commit": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "release_source": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "build_uuid": {"type": ["string", "null"], "format": "uuid"}, "environment": {"type": "string", "enum": ["dev", "production", "unknown"]}}}}}
    FeedbackProvenance: {"x-cookbook-source": "https://github.com/klappy/3d-review-cookbook/blob/f5d925f9f9d448828f7b7bb7afabc08ba6db933f/planning/2026-09-16-parity-build/AMEND-2026-09-18-feedback-provenance.md", "description": "Server submission identity distinct from client-reported experience. Null for legacy unknown records; never inferred from current health.", "anyOf": [{"type": "null"}, {"type": "object", "additionalProperties": false, "required": ["submission", "experience"], "properties": {"submission": {"type": "object", "additionalProperties": false, "required": ["source", "submitted_at", "version", "commit", "build", "build_uuid", "release_source", "environment"], "properties": {"source": {"const": "server"}, "submitted_at": {"type": "string", "format": "date-time"}, "version": {"type": "string", "maxLength": 64, "pattern": "^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$"}, "commit": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "release_source": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "build_uuid": {"type": ["string", "null"], "format": "uuid"}, "environment": {"type": "string", "enum": ["dev", "production", "unknown"]}, "build": {"type": "string"}}}, "experience": {"anyOf": [{"type": "null"}, {"type": "object", "minProperties": 2, "additionalProperties": false, "description": "Optional client-reported evidence, at most1536 UTF-8 JSON bytes; not trusted submission identity. No automatic capture implied.", "x-cookbook-source": "https://github.com/klappy/3d-review-cookbook/blob/f5d925f9f9d448828f7b7bb7afabc08ba6db933f/planning/2026-09-16-parity-build/AMEND-2026-09-18-feedback-provenance.md", "properties": {"source": {"const": "client_reported"}, "occurred_at": {"type": "string", "format": "date-time", "pattern": "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{3}Z$"}, "surface": {"type": "string", "enum": ["web", "mcp_panel", "mcp_tool", "http", "unknown"]}, "host": {"type": "string", "enum": ["browser", "chatgpt", "claude", "reference_host", "other", "unknown"]}, "client_release": {"type": "object", "minProperties": 1, "additionalProperties": false, "properties": {"version": {"type": "string", "maxLength": 64, "pattern": "^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$"}, "commit": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "release_source": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "build_uuid": {"type": ["string", "null"], "format": "uuid"}, "environment": {"type": "string", "enum": ["dev", "production", "unknown"]}}}, "api_release": {"type": "object", "minProperties": 1, "additionalProperties": false, "properties": {"version": {"type": "string", "maxLength": 64, "pattern": "^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$"}, "commit": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "release_source": {"type": "string", "pattern": "^[0-9a-f]{40}$"}, "build_uuid": {"type": ["string", "null"], "format": "uuid"}, "environment": {"type": "string", "enum": ["dev", "production", "unknown"]}}}}, "required": ["source"]}]}}}]}
    FeedbackParams:
      type: object
      additionalProperties: false
      description: cap.ops.feedback write params — AMEND 2c4ee8d CORRECTION. Strip answers/responses/response before unknown reject. Client stripped is rejected.
      properties:
        experience:
          $ref: '#/components/schemas/FeedbackExperience'
        require_authenticated:
          type: boolean
          x-cookbook-source: https://github.com/klappy/3d-review-cookbook/blob/e9c09cb97ef206abb418de741bb93629bd1c9e23/planning/2026-09-16-parity-build/AMEND-2026-09-18-feedback-attributed-write.md
          description: Optional write precondition. True returns NOT_AUTHENTICATED for an anonymous resolved principal before feedback persistence; omitted or false preserves public feedback. Never persisted.
        helpful:
          type: boolean
        note:
          type: string
          description: freeform; ≤4096 UTF-8 bytes
        text:
          type: string
          description: legacy dual-read alias stored as canonical note
        context:
          description: opaque JSON value; serialized form ≤1024 UTF-8 bytes; not helpful
        scope_type:
          type: string
          description: opaque label; ≤64 code units; default platform
        scope_id:
          type: string
          description: opaque label; ≤64 code units; default "-"
        satisfaction:
          type: integer
          minimum: 1
          maximum: 5
        confusion:
          type: integer
          minimum: 1
          maximum: 5
        frustration:
          type: integer
          minimum: 1
          maximum: 5
        sentiment_journey:
          type: string
        cast_id:
          type: string
        persona:
          type: string
        goal_id:
          type: string
        answers:
          description: stripped, never persisted
        responses:
          description: stripped, never persisted
        response:
          description: stripped, never persisted
    FeedbackWriteResult:
      type: object
      additionalProperties: false
      required:
      - recorded
      - stripped
      - feedback_id
      properties:
        recorded:
          type: boolean
          const: true
        stripped:
          type: boolean
        feedback_id:
          type: string
          description: opaque locator only; never echoes note/text/context/scores
    FeedbackGetResult:
      type: object
      additionalProperties: false
      required:
      - id
      - actor
      - scope_type
      - scope_id
      - created_at
      - body
      - provenance
      properties:
        provenance:
          $ref: '#/components/schemas/FeedbackProvenance'
        id:
          type: string
        actor:
          type: string
          description: principal id or anon
        scope_type:
          type: string
        scope_id:
          type: string
        created_at:
          type: string
          format: date-time
        body:
          type: object
          additionalProperties: false
          required:
          - stripped
          properties:
            helpful:
              type: boolean
            note:
              type: string
            context: {}
            satisfaction:
              type: integer
            confusion:
              type: integer
            frustration:
              type: integer
            sentiment_journey:
              type: string
            cast_id:
              type: string
            persona:
              type: string
            goal_id:
              type: string
            stripped:
              type: boolean
paths:
  /v2/entry:
    get:
      operationId: cap.entry.intents
      summary: 'cap.entry.intents — read — roles: V'
      x-capability: cap.entry.intents
      x-class: read
      x-tool: read
      x-slice: v2.0-bcs
      x-inverse:
        kind: n/a
      x-roles: V
      x-path-inferred: false
      tags:
      - A. Entry, identity, session
      responses:
        '200':
          description: ok envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        4XX:
          description: error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /v2/example:
    get:
      operationId: cap.entry.example
      summary: 'cap.entry.example — read — roles: V'
      x-capability: cap.entry.example
      x-class: read
      x-tool: read
      x-slice: v2.0-bcs
      x-inverse:
        kind: n/a
      x-roles: V
      x-path-inferred: false
      tags:
      - A. Entry, identity, session
      responses:
        '200':
          description: ok envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        4XX:
          description: error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
  /v2/auth/link:
    post:
      operationId: cap.auth.request_link
      summary: 'cap.auth.request_link — write.effect — roles: V'
      x-capability: cap.auth.request_link
      x-class: write.effect
      x-tool: danger
      x-slice: v2.0-bcs
      x-inverse:
        kind: none
        compensating_control: 'expire link '
      x-roles: V
      x-path-inferred: false
      tags:
      - A. Entry, identity, session
      responses:
        '200':
          description: dry_run → Impact + confirm_token; execute → receipt (inverse none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        4XX:
          description: error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - session: []
      - bearer: []
      - participant: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DangerBody'
  /v2/auth/session:
    post:
      operationId: cap.auth.consume_link
      summary: 'cap.auth.consume_link — write.reversible — roles: V'
      x-capability: cap.auth.consume_link
      x-class: write.reversible
      x-tool: write
      x-slice: v2.0-bcs
      x-inverse:
        kind: none
        compensating_control: cap.auth.logout (compensating)
      x-roles: V
      x-path-inferred: false
      tags:
      - A. Entry, identity, session
      responses:
        '200':
          description: ok envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        4XX:
          description: error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - session: []
      - bearer: []
      - participant: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: params — shape owed per capability (A1 open item)
    delete:
      operationId: cap.auth.logout
      summary: 'cap.auth.logout — write.reversible — roles: any'
      x-capability: cap.auth.logout
      x-class: write.reversible
      x-tool: write
      x-slice: v2.0-bcs
      x-inverse:
        kind: none
        compensating_control: sign in again
      x-roles: any
      x-path-inferred: false
      tags:
      - A. Entry, identity, session
      responses:
        '200':
          description: ok envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        4XX:
          description: error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
